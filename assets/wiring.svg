<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" font-family="Helvetica, Arial, sans-serif" font-size="15">
<style>.box{fill:#f6f8fa;stroke:#24292f;stroke-width:2}.t{fill:#24292f}.pin{fill:#ffffff;stroke:#24292f;stroke-width:1.5}@media (prefers-color-scheme: dark){.box{fill:#161b22;stroke:#c9d1d9}.t{fill:#c9d1d9}.pin{fill:#0d1117;stroke:#c9d1d9}}</style>
<rect class="box" x="30" y="40" width="210" height="304" rx="10"/>
<text class="t" x="135" y="30" text-anchor="middle" font-weight="bold">M5Stack Stamp S3</text>
<rect class="box" x="480" y="40" width="210" height="304" rx="10"/>
<text class="t" x="585" y="30" text-anchor="middle" font-weight="bold">INMP441 microphone</text>
<circle class="pin" cx="240" cy="96" r="6"/><text class="t" x="225" y="101" text-anchor="end">3V3</text>
<circle class="pin" cx="480" cy="96" r="6"/><text class="t" x="495" y="101">VDD</text>
<line x1="246" y1="96" x2="474" y2="96" stroke="#d93f3f" stroke-width="3"/>
<circle class="pin" cx="240" cy="140" r="6"/><text class="t" x="225" y="145" text-anchor="end">GND</text>
<circle class="pin" cx="480" cy="140" r="6"/><text class="t" x="495" y="145">GND</text>
<line x1="246" y1="140" x2="474" y2="140" stroke="#333333" stroke-width="3"/>
<circle class="pin" cx="240" cy="184" r="6"/><text class="t" x="225" y="189" text-anchor="end">GPIO1</text>
<circle class="pin" cx="480" cy="184" r="6"/><text class="t" x="495" y="189">SCK</text>
<line x1="246" y1="184" x2="474" y2="184" stroke="#2f7ed8" stroke-width="3"/>
<circle class="pin" cx="240" cy="228" r="6"/><text class="t" x="225" y="233" text-anchor="end">GPIO7</text>
<circle class="pin" cx="480" cy="228" r="6"/><text class="t" x="495" y="233">WS</text>
<line x1="246" y1="228" x2="474" y2="228" stroke="#8e44ad" stroke-width="3"/>
<circle class="pin" cx="240" cy="272" r="6"/><text class="t" x="225" y="277" text-anchor="end">GPIO5</text>
<circle class="pin" cx="480" cy="272" r="6"/><text class="t" x="495" y="277">SD</text>
<line x1="246" y1="272" x2="474" y2="272" stroke="#1e9e6a" stroke-width="3"/>
<circle class="pin" cx="240" cy="316" r="6"/><text class="t" x="225" y="321" text-anchor="end">GND</text>
<circle class="pin" cx="480" cy="316" r="6"/><text class="t" x="495" y="321">L/R</text>
<line x1="246" y1="316" x2="474" y2="316" stroke="#333333" stroke-width="3"/>
<text class="t" x="360.0" y="372" text-anchor="middle" font-size="13">L/R to GND selects the left I2S channel. Keep wires short (&lt; 20 cm).</text>
</svg>
