name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt
      - name: Unit, protocol, preset and C++/Python equivalence tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies (synthetic reference fixtures)
        run: pip install -r tools/requirements.txt
      # Emscripten pinned to match the local toolchain (7.0.1).
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.1
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.1
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          emcc --version | head -1
      - name: Preset studio tests (builds WASM, vitest incl. WASM-vs-ref.py)
        working-directory: web
        run: npm test

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [thermomix-detector.yaml, thermomix-detector-dev.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install "esphome==2026.11.0"
      - name: Dummy secrets
        working-directory: firmware
        run: |
          cp secrets.example.yaml secrets.yaml
          sed -i 's|^api_encryption_key:.*|api_encryption_key: "'"$(head -c32 /dev/urandom | base64)"'"|' secrets.yaml
          sed -i 's|^capture_psk:.*|capture_psk: "ci-dummy-capture-psk-0123456789"|' secrets.yaml
      - name: Validate
        working-directory: firmware
        run: esphome config ${{ matrix.config }} > /dev/null
      - name: Compile
        working-directory: firmware
        run: esphome compile ${{ matrix.config }}

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install "esphome==2026.11.0"
      - name: Compile examples against this checkout
        run: |
          printf 'wifi_ssid: "ci"\nwifi_password: "ci-password"\napi_encryption_key: "%s"\n' "$(head -c32 /dev/urandom | base64)" > examples/secrets.yaml
          for f in examples/*.yaml; do
            [ "$(basename "$f")" = secrets.yaml ] && continue
            # Build from the checked-out component instead of GitHub.
            sed "s|- source: github://gl0wa/esphome-alarm-sound-detector@main|- source: { type: local, path: ../components }|" "$f" > "${f%.yaml}.ci.yaml"
            esphome compile "${f%.yaml}.ci.yaml"
          done
