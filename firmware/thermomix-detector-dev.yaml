# Development-only firmware: base detector + raw-audio capture for
# labelled training-data collection. NEVER flash to a permanently
# deployed device; capture streams raw microphone audio over the LAN.
packages:
  base: !include thermomix-detector.yaml

# Capture at 16 kHz (same stream the detector uses): the capture component
# follows the microphone stream info, and 16 kHz covers the alarm spectrum.
substitutions:
  mic_sample_rate: "16000"

audio_capture:
  id: capture
  microphone:
    microphone: mic
    bits_per_sample: 24
    gain_factor: 1
  port: 6060
  buffer_size: 131072  # ~2.7 s at 16 kHz/24-bit; absorbs Wi-Fi stalls
  psk: !secret capture_psk

switch:
  - platform: audio_capture
    audio_capture_id: capture
    name: "Audio capture"
    # default OFF; restore_mode configurable, e.g. RESTORE_DEFAULT_OFF

sensor:
  - platform: audio_capture
    audio_capture_id: capture
    name: "Capture dropped bytes"

binary_sensor:
  - platform: audio_capture
    audio_capture_id: capture
    name: "Capture client connected"

button:
  - platform: template
    name: "Mark: Thermomix alarm"
    on_press:
      audio_capture.mark:
        id: capture
        label: "thermomix_alarm"
  - platform: template
    name: "Mark: Thermomix other sound"
    on_press:
      audio_capture.mark:
        id: capture
        label: "thermomix_other"
  - platform: template
    name: "Mark: Confuser sound"
    on_press:
      audio_capture.mark:
        id: capture
        label: "confuser"
  - platform: template
    name: "Mark: Background"
    on_press:
      audio_capture.mark:
        id: capture
        label: "background"
