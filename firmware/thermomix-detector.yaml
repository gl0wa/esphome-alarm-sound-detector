# Thermomix alert detector - M5Stack Stamp S3 + INMP441
# Base firmware: Wi-Fi, encrypted API, password-protected OTA, diagnostics.
substitutions:
  # Overridable by derived configs (e.g. the dev capture firmware raises
  # this to 48000). Default keeps the sound_level sanity sensor config.
  mic_sample_rate: "16000"

esphome:
  name: thermomix-detector
  friendly_name: Thermomix Detector
  min_version: 2026.11.0
  project:
    name: "thermomix-alert-detector.esphome"
    version: "0.2.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: ../components

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

debug:
  update_interval: 60s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains-powered: disable modem sleep to avoid latency spikes / audio gaps.
  power_save_mode: none
  ap:
    ssid: "Thermomix-Detector Fallback"
    password: !secret fallback_ap_password

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
  - platform: internal_temperature
    name: "Chip Temperature"
  - platform: sound_level
    microphone: mic
    passive: false
    measurement_duration: 1s
    peak:
      name: "Sound Level Peak"
    rms:
      name: "Sound Level RMS"
  - platform: alarm_sound_detector
    alarm_sound_detector_id: tm6
    name: "Alarm match score"

binary_sensor:
  - platform: alarm_sound_detector
    alarm_sound_detector_id: tm6
    name: "Thermomix alarm"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
  - platform: version
    name: "Firmware Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Restart (Safe Mode)"

# --- INMP441 I2S microphone (L/R tied to GND => left channel) ---
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO7   # WS
    i2s_bclk_pin: GPIO1    # SCK

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO5     # SD
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: ${mic_sample_rate}

alarm_sound_detector:
  id: tm6
  microphone:
    microphone: mic
    bits_per_sample: 16
  template: thermomix_tm6
  # threshold / near_threshold / period / period_tolerance / min_repetitions
  # all take the component defaults tuned for the TM6 chime.
  on_alarm_start:
    then:
      - logger.log: "TM6 alarm started"
  on_alarm_end:
    then:
      - logger.log: "TM6 alarm ended"
