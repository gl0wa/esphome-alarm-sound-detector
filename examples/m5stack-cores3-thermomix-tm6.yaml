# Example: M5Stack CoreS3 / CoreS3 SE (built-in microphones) detecting the Thermomix TM6 alarm.
# Copy this file into your ESPHome configuration directory, add the referenced
# secrets to your secrets.yaml, and adjust the names as needed.
# Generated by the preset studio / asd (board preset "cores3"); see docs/wiring.md.
substitutions:
  name: thermomix-detector
  friendly_name: Thermomix Detector
  # M5Stack CoreS3 / CoreS3 SE (built-in microphones)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0

esp32:
  board: m5stack-cores3
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf    # required by the I2S microphone / detector

external_components:
  - source: github://gl0wa/esphome-alarm-sound-detector@main
    components: [alarm_sound_detector]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}   # reuses the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # mains powered; avoids audio processing hiccups

# Microphone: any ESPHome microphone at 16 kHz works —
# https://esphome.io/components/microphone/i2s_audio/
i2c:
  - id: bsp_bus           # internal bus (ES7210 microphone ADC)
    sda: GPIO12
    scl: GPIO11

i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO34
    i2s_mclk_pin:
      number: GPIO0
      ignore_strapping_warning: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 30

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO14
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000     # the detector requires 16 kHz

alarm_sound_detector:
  - id: thermomix_tm6
    microphone:
      microphone: mic
      bits_per_sample: 16
    template: vorwerk_thermomix_tm6_alarm

binary_sensor:
  - platform: alarm_sound_detector
    alarm_sound_detector_id: thermomix_tm6
    name: "Thermomix Tm6 alarm"

sensor:
  - platform: alarm_sound_detector
    alarm_sound_detector_id: thermomix_tm6
    name: "Thermomix Tm6 match score"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
