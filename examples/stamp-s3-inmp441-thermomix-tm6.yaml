# Example: M5Stack Stamp S3 + INMP441 microphone detecting the Thermomix TM6 alarm.
# Copy this file into your ESPHome configuration directory, add the referenced
# secrets to your secrets.yaml, and adjust names/pins as needed.
substitutions:
  name: thermomix-detector
  friendly_name: Thermomix Detector
  # INMP441 wiring (see docs/wiring.md)
  mic_sck_pin: GPIO1   # SCK / BCLK
  mic_ws_pin: GPIO7    # WS / LRCLK
  mic_sd_pin: GPIO5    # SD / DOUT

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf    # required by the I2S microphone / detector

external_components:
  - source: github://gl0wa/esphome-alarm-sound-detector@main
    components: [alarm_sound_detector]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}   # reuses the API encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # mains powered; avoids audio processing hiccups

i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: ${mic_ws_pin}
    i2s_bclk_pin: ${mic_sck_pin}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: ${mic_sd_pin}
    adc_type: external
    pdm: false
    channel: left          # INMP441 L/R pin tied to GND
    bits_per_sample: 32bit
    sample_rate: 16000     # the detector requires 16 kHz

alarm_sound_detector:
  - id: tm6
    microphone:
      microphone: mic
      bits_per_sample: 16
    template: vorwerk_thermomix_tm6_alarm   # bundled preset (alias: thermomix_tm6)

binary_sensor:
  - platform: alarm_sound_detector
    alarm_sound_detector_id: tm6
    name: "Thermomix alarm"

sensor:
  - platform: alarm_sound_detector
    alarm_sound_detector_id: tm6
    name: "Alarm match score"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
